name: Build MasterConnect APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: masterconnect-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout builder
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Fetch pinned SSTP engine
        run: |
          git clone --depth 1 --branch v1.10.2 https://github.com/kittoku/Open-SSTP-Client.git app-src
          python3 masterconnect_patch.py app-src

      - name: Validate Android 13+ configuration
        working-directory: app-src
        run: |
          grep -q 'minSdk 33' app/build.gradle
          grep -q 'targetSdk 35' app/build.gradle
          grep -q 'com.masterconnect.sstp' app/build.gradle
          test -f gradlew
          chmod +x gradlew

      - name: Build release APK
        working-directory: app-src
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK
        working-directory: app-src
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload MasterConnect APK
        uses: actions/upload-artifact@v6
        with:
          name: MasterConnect-Android13Plus
          path: app-src/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
